# Runs the Phase 2 acceptance check against the real corpus.
#
# The local sandbox only has fixture articles embedded with the lexical
# fallback, which cannot show whether the calibration sampler picks a
# genuinely informative spread. This runs the same check where the articles
# and embeddings are real.
#
# NOTE: this creates a throwaway user in the database and deletes it again,
# including if the check fails. It writes nothing else.
name: Verify onboarding

on:
  workflow_dispatch:

concurrency:
  group: verify-onboarding
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify onboarding
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run verify:onboarding
